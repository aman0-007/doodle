name: Build Android APK on Git Push

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: |
          cd android
          gradle assembleDebug --stacktrace --no-daemon

      - name: Locate & Collect APK
        run: |
          mkdir -p build-artifacts
          find android/app/build/outputs/apk/ -type f -name "*.apk" -exec cp {} build-artifacts/floating-doodle-eyes-debug.apk \;
          echo "Listing build-artifacts directory:"
          ls -la build-artifacts/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: floating-doodle-eyes-debug-apk
          path: build-artifacts/floating-doodle-eyes-debug.apk
          retention-days: 30
