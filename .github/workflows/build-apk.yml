name: Build Android APK on Git Push

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant Execute Permission to Gradle Wrapper
        run: |
          cd android
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Locate & Rename APK
        run: |
          mkdir -p build-artifacts
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} build-artifacts/floating-doodle-eyes-debug.apk \;

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: floating-doodle-eyes-debug-apk
          path: build-artifacts/floating-doodle-eyes-debug.apk
          retention-days: 30
