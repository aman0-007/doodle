name: Build Android APK on Git Push

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK & Accept Licenses
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "Using Android SDK from: $ANDROID_HOME"
          yes | sdkmanager --licenses || true

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate & Collect APK
        run: |
          mkdir -p build-artifacts
          find android/app/build/outputs/apk/ -type f -name "*.apk" -exec cp {} build-artifacts/floating-doodle-eyes-debug.apk \;
          echo "APK Artifacts located:"
          ls -lh build-artifacts/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: floating-doodle-eyes-debug-apk
          path: build-artifacts/floating-doodle-eyes-debug.apk
          retention-days: 30
