name: Build Android APK on Git Push

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK Environment & Accept Licenses
        run: |
          SDKMANAGER=$(find $ANDROID_HOME -name "sdkmanager" | head -n 1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses || true
            "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" || true
          fi
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace --info

      - name: Locate & Collect APK
        run: |
          mkdir -p build-artifacts
          find android/app/build/outputs/apk/ -type f -name "*.apk" -exec cp {} build-artifacts/floating-doodle-eyes-debug.apk \;
          echo "APK Artifacts located:"
          ls -lh build-artifacts/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: floating-doodle-eyes-debug-apk
          path: build-artifacts/floating-doodle-eyes-debug.apk
          retention-days: 30
